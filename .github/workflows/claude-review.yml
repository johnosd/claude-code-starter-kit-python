name: Claude Code Review
on:
  pull_request:
    branches: [main]
    
jobs:
    review:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          pull-requests: write
          issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0 

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Install Claude Code Review dependencies
              run: |
                npm install -g @anthropic-ai/claude-code

            - name: Run Code Review
              env:
                ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
                python -c "
                import anthropic, json

                client = anthropic.Anthropic()
                files = '''$FILES'''

                response = client.messages.create(
                    model='claude-haiku-4-5-20251001',
                    max_tokens=2048,
                    messages=[{
                        'role': 'user',
                        'content': f'Faça um code review dos arquivos alterados neste PR:\n{files}\n\nChecklist: segurança, type hints, qualidade, testes.'
                    }]
                )

                result = {'review': response.content[0].text}
                with open('review-results.json', 'w') as f:
                    json.dump(result, f)
                print(result['review'])
                "

            - name: Run Tests
              run: |
                pytest --json-report --json-report-file=test-results.json || true

            - name: Analyze tests results
              env:
                ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                python -c "
                import anthropic, json

                client = anthropic.Anthropic()

                with open('test-results.json') as f:
                    tests = json.load(f)

                response = client.messages.create(
                    model='claude-haiku-4-5-20251001',
                    max_tokens=1024,
                    messages=[{
                        'role': 'user',
                        'content': f'Analise estes resultados de teste e reporte apenas falhas com sugestão de correção:\n{json.dumps(tests)}'
                    }]
                )

                result = {'analysis': response.content[0].text}
                with open('test-analysis.json', 'w') as f:
                    json.dump(result, f)
                "
            - name: Post review comment
              uses: actions/github-script@v7
              with:
                script: |
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('review-results.json', 'utf8'));
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: data.review
                  });

            - name: Post test results comment
              uses: actions/github-script@v7
              with:
                script: |
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('test-analysis.json', 'utf8'));
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: data.analysis
                  });